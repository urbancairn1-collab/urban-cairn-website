<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Chirag · Urban Cairn Tech Solution</title>
<meta name="description" content="Digital business card — Mr. Chirag, Sales Manager Head, Urban Cairn Tech Solution." />
<style>
  :root{
    --navy:#1c3d5e;
    --navy-deep:#152f49;
    --blue:#2f6fb0;
    --ink:#1b2733;
    --muted:#6b7a8c;
    --line:#e7ecf2;
    --bg:#eef2f7;
    --white:#ffffff;
    --radius:22px;
    --dur:220ms;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #dfe7f1 0%, var(--bg) 60%) fixed;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--white);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(21,47,73,.45), 0 2px 8px rgba(21,47,73,.08);
    animation:rise .6s var(--ease) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}

  /* ---------- NAVY HEADER ---------- */
  .head{
    position:relative;
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:26px 24px 64px;
  }
  .head::after{ /* subtle texture sheen */
    content:"";position:absolute;inset:0;
    background:radial-gradient(300px 160px at 85% 0%, rgba(255,255,255,.10), transparent 70%);
    pointer-events:none;
  }
  .logoplate{
    display:inline-block;background:#fff;border-radius:12px;
    padding:10px 14px;box-shadow:0 6px 16px -8px rgba(0,0,0,.45);
  }
  .logoplate img{display:block;width:160px;height:auto;}

  /* avatar overlapping the band */
  .avatar-wrap{position:absolute;left:24px;bottom:-38px;}
  .avatar{
    width:88px;height:88px;border-radius:50%;
    background:linear-gradient(150deg,#2f6fb0,#1c3d5e);
    border:4px solid #fff;
    box-shadow:0 10px 22px -8px rgba(21,47,73,.6);
    display:flex;align-items:center;justify-content:center;
    font-size:38px;font-weight:800;color:#fff;letter-spacing:1px;
  }

  /* ---------- WHITE BODY ---------- */
  .body{padding:52px 24px 26px;}
  .name{font-size:26px;font-weight:800;letter-spacing:-.3px;margin:0;color:var(--navy);}
  .title{font-size:14px;color:var(--blue);font-weight:600;margin:3px 0 1px;}
  .company{font-size:13px;color:var(--muted);margin:0;}

  .divider{height:1px;background:var(--line);margin:20px 0;}

  /* contact rows */
  .rows{display:flex;flex-direction:column;gap:10px;}
  .row{
    display:flex;align-items:center;gap:14px;
    padding:12px 14px;border-radius:14px;
    background:#f6f8fb;border:1px solid var(--line);
    text-decoration:none;color:var(--ink);
    transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur);
  }
  .row:hover,.row:focus-visible{transform:translateY(-2px);box-shadow:0 10px 22px -14px rgba(21,47,73,.5);border-color:#cfe0f1;outline:none;}
  .row:active{transform:translateY(0);}
  .ricon{
    flex:0 0 38px;width:38px;height:38px;border-radius:10px;
    background:linear-gradient(150deg,#eaf2fb,#dce9f7);
    display:flex;align-items:center;justify-content:center;color:var(--navy);
  }
  .ricon svg{width:19px;height:19px;}
  .rtext{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
  .rlabel{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;}
  .rval{font-size:14.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* socials */
  .socials{display:flex;gap:12px;justify-content:center;margin:20px 0 4px;}
  .soc{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;text-decoration:none;
    box-shadow:0 8px 18px -10px rgba(21,47,73,.7);
    transition:transform var(--dur) var(--ease),filter var(--dur);
  }
  .soc:hover{transform:translateY(-3px) scale(1.05);filter:brightness(1.07);}
  .soc svg{width:21px;height:21px;}
  .soc.ig{background:linear-gradient(135deg,#feda75,#d62976 45%,#962fbf 75%,#4f5bd5);}
  .soc.li{background:#0a66c2;}
  .soc.fb{background:#1877f2;}

  /* save button */
  .save{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;margin-top:18px;padding:15px 18px;
    border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,var(--blue),var(--navy));
    color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px;
    box-shadow:0 14px 26px -12px rgba(28,61,94,.8);
    transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
  }
  .save:hover{transform:translateY(-2px);box-shadow:0 18px 30px -12px rgba(28,61,94,.85);}
  .save:active{transform:translateY(0);}
  .save svg{width:18px;height:18px;}

  /* QR */
  .qrwrap{display:flex;flex-direction:column;align-items:center;margin-top:24px;}
  .qrbox{padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 20px -14px rgba(21,47,73,.5);}
  .qrbox img,.qrbox canvas{display:block;border-radius:6px;}
  .scan{margin-top:9px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;}

  .foot{text-align:center;font-size:11px;color:var(--muted);padding:16px 0 4px;}
  .foot a{color:var(--blue);text-decoration:none;}
</style>
</head>

  <!-- ================= CARD LOGIC ================= -->
  <script>
  /* ─────────────────────────────────────────────────────────────
     EDIT EVERYTHING HERE. Change a value once → card text, links,
     vCard download, and QR code all update automatically.
     Swap the THREE social placeholders with your real URLs.
     ───────────────────────────────────────────────────────────── */
  const CARD = {
    firstName: "Chirag",
    lastName:  "",                       // add surname if you want it in saved contact
    prefix:    "Mr.",
    title:     "Sales Manager Head",
    org:       "Urban Cairn Tech Solution",
    phone:     "+919016425009",          // dial format (with country code)
    phoneShow: "+91 90164 25009",        // pretty text shown on card
    email:     "urbancairn1@gmail.com",
    website:   "https://urbancairn.in",
    websiteShow:"urbancairn.in",
    cardURL:   "https://urbancairn.in/chirag/",   // jahan card host hoga; QR isi ko kholega
    instagram: "https://www.instagram.com/urbancairn1/",
    linkedin:  "https://www.linkedin.com/in/rahul-kumar-a615b2405/",
    facebook:  "https://www.facebook.com/profile.php?id=61588905010382"
  };

  /* ---- wire up the tap-to-act links + visible values ---- */
  const $ = (id) => document.getElementById(id);
  $("row-phone").href = "tel:" + CARD.phone;
  $("val-phone").textContent = CARD.phoneShow;
  $("row-email").href = "mailto:" + CARD.email;
  $("val-email").textContent = CARD.email;
  $("row-web").href = CARD.website;
  $("val-web").textContent = CARD.websiteShow;
  $("foot-web").href = CARD.website;
  $("foot-web").textContent = CARD.websiteShow;
  $("soc-ig").href = CARD.instagram;
  $("soc-li").href = CARD.linkedin;
  $("soc-fb").href = CARD.facebook;

  /* ---- build the vCard (3.0) text ---- */
  function buildVCard(includeSocials){
    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${CARD.lastName};${CARD.firstName};;${CARD.prefix};`,
      `FN:${CARD.prefix} ${CARD.firstName}${CARD.lastName ? " " + CARD.lastName : ""}`.trim(),
      `ORG:${CARD.org}`,
      `TITLE:${CARD.title}`,
      `TEL;TYPE=CELL,VOICE:${CARD.phone}`,
      `EMAIL;TYPE=INTERNET,WORK:${CARD.email}`,
      `URL:${CARD.website}`
    ];
    if (includeSocials){
      // only add real (non-placeholder) social URLs
      if (!CARD.instagram.includes("_URL_HERE")) lines.push(`X-SOCIALPROFILE;TYPE=instagram:${CARD.instagram}`);
      if (!CARD.linkedin.includes("_URL_HERE"))  lines.push(`X-SOCIALPROFILE;TYPE=linkedin:${CARD.linkedin}`);
      if (!CARD.facebook.includes("_URL_HERE"))  lines.push(`X-SOCIALPROFILE;TYPE=facebook:${CARD.facebook}`);
    }
    lines.push("END:VCARD");
    return lines.join("\r\n");
  }

  /* ---- "Save to Contacts" → download .vcf (no server) ---- */
  $("saveBtn").addEventListener("click", () => {
    const vcf = buildVCard(true);
    const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Chirag-UrbanCairn.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  });

  /* ---- QR code: opens the live card page (CARD.cardURL) so EVERY phone
          camera scans it reliably. The page's "Save to Contacts" button then
          saves the vCard. Change cardURL above to match where you upload. ---- */
  new QRCode($("qr"), {
    text: CARD.cardURL,
    width: 150,
    height: 150,
    colorDark: "#1c3d5e",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
  </script>
