# Urban Cairn — nginx config for the container that serves dist/
#
# The build produces a real folder-per-route (e.g. /in/anand/index.html) with
# fully prerendered HTML, so we serve those files directly and DO NOT use a
# blanket SPA rewrite. A blanket "try_files ... /index.html" would hand the
# homepage HTML to crawlers for every URL and undo the per-route SEO work.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Behind another reverse proxy (Traefik / npm / host nginx), so no TLS here.
    server_tokens off;

    # ---- compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ---- security headers --------------------------------------------------
    # HSTS is deliberately NOT set here — terminate it at the edge proxy that
    # owns TLS, otherwise you can poison the domain before certs are working.
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # ---- hashed build assets: immutable, cache hard ------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Static media that keeps its filename across builds — cache, but revalidate.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- SEO files: always fresh ------------------------------------------
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ---- prerendered HTML routes ------------------------------------------
    # $uri            -> exact file (e.g. /sitemap.xml)
    # $uri/           -> folder index (e.g. /in/anand/ -> /in/anand/index.html)
    # =404            -> real 404, handled below by 404.html (which boots the
    #                    SPA and lets React Router render its NotFound page)
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # Don't serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
